services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app service will be added once the server Dockerfile lands (OPS-01)
  # server:
  #   build: .
  #   ports:
  #     - '3333:3333'
  #   env_file: .env
  #   depends_on:
  #     mongo:
  #       condition: service_healthy

volumes:
  mongo-data:
